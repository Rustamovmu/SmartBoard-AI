[project]
name = "smartbord-vision"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "Standalone bounded in-memory CPU frame measurements"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = ["real_model: requires explicitly prepared local YOLO11n ONNX weights"]
