type Account {
  createdAt: String!
  email: String!
  id: ID!
  name: String!
  role: AccountRole!
  status: AccountState!
  username: String
}

type AccountPage {
  items: [Account!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

enum AccountRole {
  ADMIN
  USER
}

enum AccountState {
  ACTIVE
  BLOCKED
  DELETED
}

input AccountsInput {
  page: Int! = 1
  pageSize: Int! = 20
  role: AccountRole
  status: AccountState
}

input AdminDevicesInput {
  page: Int! = 1
  pageSize: Int! = 20
  status: DeviceState
  userId: ID!
}

input AdminHelpEntriesInput {
  kind: HelpKind!
  page: Int! = 1
  pageSize: Int! = 20
  state: HelpState
  topic: HelpTopic
}

type AdminHelpEntry {
  bodyMarkdown: String!
  createdAt: String!
  createdByUserId: ID!
  id: ID!
  kind: HelpKind!
  order: Int!
  publishedAt: String
  revision: Int!
  state: HelpState!
  title: String!
  topic: HelpTopic
  updatedAt: String!
  updatedByUserId: ID!
}

type AdminHelpPage {
  items: [AdminHelpEntry!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

input CommunityCommentsInput {
  page: Int! = 1
  pageSize: Int! = 20
  postId: ID!
}

enum CommunityModerationAction {
  REMOVE
  RESTORE
}

input CommunityPostsInput {
  page: Int! = 1
  pageSize: Int! = 20
}

enum CommunityReason {
  ABUSE
  OFF_TOPIC
  OTHER
  PRIVACY
  SPAM
}

type CommunityReport {
  createdAt: String!
  id: ID!
  postId: ID!
  reason: CommunityReason!
  revision: Int!
  state: ReportState!
  targetId: ID!
  targetType: ReportTarget!
  updatedAt: String!
}

input CommunityReportsInput {
  page: Int! = 1
  pageSize: Int! = 20
  state: ReportState
  targetType: ReportTarget
}

type CommunityReportsPage {
  items: [CommunityReport!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

enum CommunityState {
  DRAFT
  PUBLISHED
  REMOVED
}

input ConfirmDevicePairingInput {
  code: String!
}

input CreateCommunityCommentInput {
  bodyMarkdown: String!
  postId: ID!
  publicDisplayName: String!
}

input CreateCommunityPostInput {
  bodyMarkdown: String!
  publicDisplayName: String!
  title: String!
}

input CreateCommunityReportInput {
  reason: CommunityReason!
  targetId: ID!
  targetType: ReportTarget!
}

input CreateDevicePairingInput {
  label: String!
  platform: DevicePlatform!
}

input CreateHelpEntryInput {
  bodyMarkdown: String!
  kind: HelpKind!
  order: Int! = 0
  title: String!
  topic: HelpTopic
}

type DevicePage {
  items: [EnrolledDevice!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

type DevicePairing {
  code: String!
  expiresAt: String!
}

enum DevicePlatform {
  ANDROID
  IOS
}

enum DeviceState {
  ACTIVE
  REVOKED
}

input DevicesInput {
  page: Int! = 1
  pageSize: Int! = 20
  status: DeviceState
}

type EnrolledDevice {
  createdAt: String!
  id: ID!
  label: String!
  platform: DevicePlatform!
  revokedAt: String
  status: DeviceState!
  userId: ID!
}

input HelpEntriesInput {
  kind: HelpKind!
  page: Int! = 1
  pageSize: Int! = 20
  topic: HelpTopic
}

enum HelpKind {
  ANNOUNCEMENT
  FAQ
}

enum HelpState {
  ARCHIVED
  DRAFT
  PUBLISHED
}

enum HelpTopic {
  ACCOUNTS
  DEVICES
  GENERAL
  LOCAL_STORAGE
  OTHER
  PRIVACY
}

type ManagedCommunityComment {
  authorUserId: ID!
  bodyMarkdown: String!
  createdAt: String!
  id: ID!
  postId: ID!
  publicDisplayName: String!
  publishedAt: String!
  removalReason: CommunityReason
  removedAt: String
  revision: Int!
  state: CommunityState!
  updatedAt: String!
}

input ManagedCommunityCommentsInput {
  page: Int! = 1
  pageSize: Int! = 20
  postId: ID
  state: CommunityState
}

type ManagedCommunityCommentsPage {
  items: [ManagedCommunityComment!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

type ManagedCommunityPage {
  items: [ManagedCommunityPost!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

type ManagedCommunityPost {
  authorUserId: ID!
  bodyMarkdown: String!
  createdAt: String!
  id: ID!
  publicDisplayName: String!
  publishedAt: String
  removalReason: CommunityReason
  removedAt: String
  revision: Int!
  state: CommunityState!
  title: String!
  updatedAt: String!
}

input ManagedCommunityPostsInput {
  page: Int! = 1
  pageSize: Int! = 20
  state: CommunityState
}

input ModerateCommunityCommentInput {
  action: CommunityModerationAction!
  expectedRevision: Int!
  id: ID!
  reason: CommunityReason
}

input ModerateCommunityPostInput {
  action: CommunityModerationAction!
  expectedRevision: Int!
  id: ID!
  reason: CommunityReason
}

type Mutation {
  adminCreateHelpEntry(input: CreateHelpEntryInput!): AdminHelpEntry!
  adminModerateCommunityComment(input: ModerateCommunityCommentInput!): ManagedCommunityComment!
  adminModerateCommunityPost(input: ModerateCommunityPostInput!): ManagedCommunityPost!
  adminReviewCommunityReport(input: ReviewCommunityReportInput!): CommunityReport!
  adminRevokeDevice(input: RevokeDeviceInput!): EnrolledDevice!
  adminRevokeDevices(input: RevokeDevicesInput!): DevicePage!
  adminUpdateAccountAccess(input: UpdateAccountAccessInput!): Account!
  adminUpdateHelpEntry(input: UpdateHelpEntryInput!): AdminHelpEntry!
  confirmDevicePairing(input: ConfirmDevicePairingInput!): EnrolledDevice!
  createCommunityComment(input: CreateCommunityCommentInput!): ManagedCommunityComment!
  createCommunityPost(input: CreateCommunityPostInput!): ManagedCommunityPost!
  createCommunityReport(input: CreateCommunityReportInput!): CommunityReport!
  createDevicePairing(input: CreateDevicePairingInput!): DevicePairing!
  revokeDevice(input: RevokeDeviceInput!): EnrolledDevice!
  revokeDevices(input: RevokeDevicesInput!): DevicePage!
  setMyUsername(input: SetMyUsernameInput!): Account!
  updateCommunityComment(input: UpdateCommunityCommentInput!): ManagedCommunityComment!
  updateCommunityPost(input: UpdateCommunityPostInput!): ManagedCommunityPost!
}

type PublishedCommunityComment {
  bodyMarkdown: String!
  id: ID!
  postId: ID!
  publicDisplayName: String!
  publishedAt: String!
  updatedAt: String!
}

type PublishedCommunityCommentsPage {
  items: [PublishedCommunityComment!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

type PublishedCommunityPage {
  items: [PublishedCommunitySummary!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

type PublishedCommunityPost {
  bodyMarkdown: String!
  id: ID!
  publicDisplayName: String!
  publishedAt: String!
  title: String!
  updatedAt: String!
}

type PublishedCommunitySummary {
  id: ID!
  publicDisplayName: String!
  publishedAt: String!
  title: String!
  updatedAt: String!
}

type PublishedHelpEntry {
  bodyMarkdown: String!
  id: ID!
  kind: HelpKind!
  order: Int!
  publishedAt: String!
  title: String!
  topic: HelpTopic
  updatedAt: String!
}

type PublishedHelpPage {
  items: [PublishedHelpSummary!]!
  page: Int!
  pageSize: Int!
  total: Int!
}

type PublishedHelpSummary {
  id: ID!
  kind: HelpKind!
  order: Int!
  publishedAt: String!
  title: String!
  topic: HelpTopic
  updatedAt: String!
}

type Query {
  adminAccounts(input: AccountsInput!): AccountPage!
  adminCommunityComment(id: ID!): ManagedCommunityComment!
  adminCommunityComments(input: ManagedCommunityCommentsInput!): ManagedCommunityCommentsPage!
  adminCommunityPost(id: ID!): ManagedCommunityPost!
  adminCommunityPosts(input: ManagedCommunityPostsInput!): ManagedCommunityPage!
  adminCommunityReports(input: CommunityReportsInput!): CommunityReportsPage!
  adminDevices(input: AdminDevicesInput!): DevicePage!
  adminHelpEntries(input: AdminHelpEntriesInput!): AdminHelpPage!
  adminHelpEntry(id: ID!): AdminHelpEntry!
  communityComments(input: CommunityCommentsInput!): PublishedCommunityCommentsPage!
  communityPost(id: ID!): PublishedCommunityPost!
  communityPosts(input: CommunityPostsInput!): PublishedCommunityPage!
  currentAccount: Account!
  currentDevice: EnrolledDevice
  helpEntries(input: HelpEntriesInput!): PublishedHelpPage!
  helpEntry(id: ID!): PublishedHelpEntry!
  myCommunityComment(id: ID!): ManagedCommunityComment!
  myCommunityComments(input: ManagedCommunityCommentsInput!): ManagedCommunityCommentsPage!
  myCommunityPost(id: ID!): ManagedCommunityPost!
  myCommunityPosts(input: ManagedCommunityPostsInput!): ManagedCommunityPage!
  myCommunityReports(input: CommunityReportsInput!): CommunityReportsPage!
  myDevices(input: DevicesInput!): DevicePage!
}

enum ReportState {
  DISMISSED
  OPEN
  RESOLVED
}

enum ReportTarget {
  COMMENT
  POST
}

input ReviewCommunityReportInput {
  expectedRevision: Int!
  id: ID!
  state: ReportState!
}

input RevokeDeviceInput {
  id: ID!
}

input RevokeDevicesInput {
  ids: [ID!]!
}

input SetMyUsernameInput {
  username: String!
}

input UpdateAccountAccessInput {
  id: ID!
  role: AccountRole
  status: AccountState
}

input UpdateCommunityCommentInput {
  bodyMarkdown: String
  expectedRevision: Int!
  id: ID!
  publicDisplayName: String
  state: CommunityState
}

input UpdateCommunityPostInput {
  bodyMarkdown: String
  expectedRevision: Int!
  id: ID!
  publicDisplayName: String
  state: CommunityState
  title: String
}

input UpdateHelpEntryInput {
  bodyMarkdown: String
  expectedRevision: Int!
  id: ID!
  order: Int
  state: HelpState
  title: String
  topic: HelpTopic
}
